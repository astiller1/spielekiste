<!doctype html><html lang="de"><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kapitän Leo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
  :root {
    --sky: #8fd6ff;
    --deep: #0a2c4e;
    --sun: #ffc93c;
    --sun-dark: #c98f00;
    --coral: #ff6b4a;
    --paper: #fff7e3;
    --ink: #173451;
    --wood: #9c6b3f;
    --green: #2f9e44;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--deep); color: var(--ink);
    font-family: 'Nunito', system-ui, sans-serif; overflow: hidden;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app { position: relative; width: 100%; height: 100%; overflow: hidden; }
  #sea { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 4px solid #fff; outline-offset: 3px; }

  .hud {
    position: absolute; left: 0; right: 0; top: 0;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
    padding: 12px 16px; pointer-events: none;
  }
  .hud > * { pointer-events: auto; }
  .pill {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255, 247, 227, .94); border: 3px solid #fff; border-radius: 999px;
    box-shadow: 0 4px 0 rgba(23, 52, 81, .28);
  }
  .coins { padding: 5px 16px 5px 6px; }
  .coin {
    width: 34px; height: 34px; border-radius: 50%; flex: none; position: relative; box-sizing: border-box;
    background: radial-gradient(circle at 35% 30%, #fff6c2 0 16%, #ffd23f 17% 62%, #e9a800 63%);
    border: 3px solid #b77b00;
  }
  .coin::after { content: ""; position: absolute; inset: 5px; border: 2px solid rgba(183, 123, 0, .5); border-radius: 50%; }
  .coin.sm { width: 24px; height: 24px; border-width: 2px; }
  .coin.sm::after { inset: 3px; border-width: 1.5px; }
  #coinNum { font-family: 'Lilita One', 'Arial Rounded MT Bold', system-ui, sans-serif; font-size: 30px; line-height: 1; min-width: 1.4ch; font-variant-numeric: tabular-nums; }
  .coins.bump { animation: bump .35s ease; }
  @keyframes bump { 50% { transform: scale(1.12); } }

  .crate { padding: 6px 10px; gap: 5px; flex-wrap: wrap; justify-content: center; border-radius: 18px; max-width: 46vw; }
  .crate-label { font-weight: 900; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #7a4e24; margin-right: 2px; }
  .slot { width: 32px; height: 24px; border-radius: 6px; background: #c69157; border: 2px solid #7a4e24; box-sizing: border-box; }
  .slot.full { background: #f3d6a4; }
  .slot canvas { width: 100%; height: 100%; display: block; }
  .crate.full { animation: wiggle .6s ease infinite; background: #ffe3dc; }
  @keyframes wiggle { 25% { transform: rotate(-2deg); } 75% { transform: rotate(2deg); } }

  .btns { display: flex; gap: 10px; align-items: flex-start; }
  .round {
    width: 52px; height: 52px; border-radius: 50%; border: 3px solid #fff; background: rgba(255, 247, 227, .94);
    box-shadow: 0 4px 0 rgba(23, 52, 81, .28); cursor: pointer; display: grid; place-items: center; padding: 0;
  }
  .round svg { width: 26px; height: 26px; }
  .shop-btn {
    display: flex; flex-direction: column; align-items: center; gap: 0; cursor: pointer;
    background: var(--sun); border: 4px solid #fff; border-radius: 22px; padding: 4px 12px 6px;
    font-family: 'Lilita One', 'Arial Rounded MT Bold', system-ui, sans-serif; font-size: 18px; letter-spacing: .02em;
    box-shadow: 0 5px 0 var(--sun-dark);
  }
  .shop-btn canvas { width: 56px; height: 34px; display: block; }
  .shop-btn.glow { animation: hop 1s ease-in-out infinite; }
  @keyframes hop { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-5px) scale(1.07); } }

  @media (max-width: 560px) {
    .hud { flex-wrap: wrap; }
    .crate { order: 3; max-width: none; flex-basis: 100%; justify-content: flex-start; }
    #coinNum { font-size: 26px; }
  }

  /* Werft (shop) */
  .overlay {
    position: absolute; inset: 0; background: rgba(10, 44, 78, .55);
    display: flex; align-items: flex-end; justify-content: center; padding: 16px; box-sizing: border-box;
  }
  .sheet {
    background: var(--paper); border: 5px solid #fff; border-radius: 30px; width: 100%; max-width: 900px;
    max-height: 100%; overflow: auto; box-sizing: border-box; padding: 18px 18px 14px;
    box-shadow: 0 10px 0 rgba(10, 44, 78, .35); animation: rise .3s ease-out;
  }
  @keyframes rise { from { transform: translateY(40px); opacity: .4; } }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .sheet h2 { font-family: 'Lilita One', 'Arial Rounded MT Bold', system-ui, sans-serif; font-weight: 400; font-size: 34px; margin: 0; letter-spacing: .01em; }
  .wallet { display: flex; align-items: center; gap: 6px; font-family: 'Lilita One', system-ui, sans-serif; font-size: 26px; margin-left: auto; font-variant-numeric: tabular-nums; }
  .x { width: 52px; height: 52px; border-radius: 50%; border: 3px solid #fff; background: var(--coral); color: #fff; font-size: 30px; font-weight: 900; cursor: pointer; line-height: 1; box-shadow: 0 4px 0 #c4442a; flex: none; }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 720px) { .cards { grid-template-columns: repeat(2, 1fr); } }
  .card {
    position: relative; background: #fff; border: 3px solid #f0dcb0; border-radius: 22px; padding: 10px 10px 12px;
    display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; overflow: hidden;
  }
  .card canvas { width: 120px; height: 84px; max-width: 100%; }
  .card h3 { font-family: 'Lilita One', 'Arial Rounded MT Bold', system-ui, sans-serif; font-weight: 400; font-size: 24px; margin: 0; }
  .card p { margin: 0; font-size: 14px; font-weight: 800; color: #5b6f84; min-height: 2.4em; text-wrap: balance; }
  .pips { display: flex; gap: 5px; margin: 2px 0 6px; }
  .pip { width: 13px; height: 13px; border-radius: 50%; background: #eadfc6; border: 2px solid #d8c59c; }
  .pip.on { background: var(--green); border-color: #1f7a3a; }
  .buy {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
    border: 3px solid #fff; border-radius: 16px; padding: 8px 6px; background: var(--sun);
    font-family: 'Lilita One', system-ui, sans-serif; font-size: 24px; box-shadow: 0 4px 0 var(--sun-dark);
    font-variant-numeric: tabular-nums;
  }
  .buy.poor { background: #e7e1d3; box-shadow: 0 4px 0 #bdb39c; color: #8a8270; }
  .buy.done { background: #8ce99a; box-shadow: 0 4px 0 #2f9e44; cursor: default; }
  .buy:active:not(.done) { transform: translateY(3px); box-shadow: 0 1px 0 var(--sun-dark); }
  .card.shake { animation: shake .4s ease; }
  @keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
  .card.pop { animation: pop .5s ease; }
  @keyframes pop { 40% { transform: scale(1.06); } }
  .confetti { position: absolute; width: 9px; height: 13px; border-radius: 2px; left: 50%; top: 40%; pointer-events: none; animation: conf .9s ease-out forwards; }
  @keyframes conf { to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; } }

  .album { margin-top: 16px; }
  .album h3 { font-family: 'Lilita One', system-ui, sans-serif; font-weight: 400; font-size: 22px; margin: 0 0 8px; }
  .album-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(82px, 1fr)); gap: 8px; }
  .af { background: #e3f4fc; border-radius: 14px; padding: 4px 4px 6px; text-align: center; font-size: 12px; font-weight: 800; color: #4a6680; }
  .af.got { background: #d3f9d8; color: var(--ink); }
  .af canvas { width: 72px; height: 46px; display: block; margin: 0 auto; }
  .af b { display: block; font-size: 13px; }
  .parents { display: flex; justify-content: flex-end; margin-top: 14px; }
  .reset { background: none; border: 2px dashed #c7b892; border-radius: 12px; padding: 6px 12px; font-size: 13px; font-weight: 800; color: #8a7d5c; cursor: pointer; }
  .reset.armed { border-style: solid; border-color: var(--coral); color: #c4442a; background: #fff0ec; }

  /* Start */
  .start { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(10, 44, 78, .35); box-sizing: border-box; }
  .start-card { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 520px; }
  .start h1 {
    margin: 0; font-family: 'Lilita One', 'Arial Rounded MT Bold', system-ui, sans-serif; font-weight: 400;
    font-size: clamp(44px, 11vw, 86px); line-height: .95; color: #fff; letter-spacing: .01em; text-wrap: balance;
    text-shadow: 0 5px 0 var(--ink), 0 0 0 var(--ink); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill;
  }
  .start h1 span { color: var(--sun); display: block; }
  .start p { margin: 0; font-size: 18px; font-weight: 800; color: #fff; text-shadow: 0 2px 0 var(--ink); max-width: 30ch; text-wrap: balance; }
  .keys { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; font-weight: 800; font-size: 15px; color: #fff; text-shadow: 0 2px 0 var(--ink); }
  .keys li { display: flex; align-items: center; gap: 4px; }
  kbd { font-family: inherit; font-size: 14px; background: var(--paper); color: var(--ink); text-shadow: none; border-radius: 7px; padding: 2px 8px; box-shadow: 0 3px 0 rgba(23, 52, 81, .5); }
  @media (hover: none) { .keys { display: none; } }
  .play {
    width: 120px; height: 120px; border-radius: 50%; border: 6px solid #fff; background: var(--coral); cursor: pointer;
    box-shadow: 0 8px 0 #c4442a; display: grid; place-items: center; animation: hop 1.2s ease-in-out infinite;
  }
  .play svg { width: 54px; height: 54px; margin-left: 8px; }
  .slot { position: relative; }
  .slot.giant { border-color: #e8590c; background: #ffd8a8; }
  .slot.shiny { box-shadow: 0 0 0 2px #fff3bf, 0 0 10px 2px #fcc419; }
  .card.special { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 10px 16px; background: #fff9db; border-color: #ffd43b; }
  .card.special .info { display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 2px; flex: 1 1 180px; }
  .card.special p { min-height: 0; }
  .card.special .buy { width: auto; min-width: 150px; flex: 0 0 auto; }
  .buy.locked { background: #e7e1d3; box-shadow: 0 4px 0 #bdb39c; color: #8a8270; }
  .album h3 small { font-family: 'Nunito', system-ui, sans-serif; font-weight: 800; font-size: 14px; color: #5b6f84; margin-left: 8px; }
  .af { position: relative; }
  .af .shine { position: absolute; top: 2px; right: 6px; font-size: 16px; color: #f59f00; }
  .win { background: rgba(10, 44, 78, .6); }
  .cup { font-size: 72px; line-height: 1; }
  .again {
    font-family: 'Lilita One', 'Arial Rounded MT Bold', system-ui, sans-serif; font-size: 28px; color: var(--ink);
    background: var(--sun); border: 5px solid #fff; border-radius: 24px; padding: 10px 28px; cursor: pointer;
    box-shadow: 0 6px 0 var(--sun-dark);
  }
  @media (prefers-reduced-motion: reduce) {
    .play, .shop-btn.glow, .crate.full { animation: none; }
  }
</style>

<div id="app">
  <canvas id="sea" aria-label="Meer mit Fischen. Tippe auf einen Fisch, um ihn zu angeln."></canvas>

  <div class="hud">
    <div class="pill coins" id="coins" aria-live="polite"><span class="coin"></span><span id="coinNum">0</span></div>
    <div class="pill crate" id="crate" aria-label="Fischkiste"></div>
    <div class="btns">
      <button class="round" id="soundBtn" aria-label="Ton aus"></button>
      <button class="shop-btn" id="shopBtn"><canvas id="shopIco" width="112" height="68"></canvas>Werft</button>
    </div>
  </div>

  <div class="overlay" id="shop" hidden>
    <div class="sheet" role="dialog" aria-label="Werft">
      <div class="sheet-head">
        <h2>Werft</h2>
        <div class="wallet"><span class="coin sm"></span><span id="walletNum">0</span></div>
        <button class="x" id="closeShop" aria-label="Schließen">×</button>
      </div>
      <div class="cards" id="cards"></div>
      <div class="album">
        <h3>Meine Fische<small id="albumNote"></small></h3>
        <div class="album-row" id="albumRow"></div>
      </div>
      <div class="parents"><button class="reset" id="resetBtn">Neues Spiel</button></div>
    </div>
  </div>

  <div class="start" id="start">
    <div class="start-card">
      <h1>Kapitän <span>Leo</span></h1>
      <p>Fang Fische, verkauf sie im Hafen und bau dein Boot aus!</p>
      <ul class="keys" aria-label="Tastatur">
        <li><kbd>←</kbd><kbd>→</kbd> fahren</li>
        <li><kbd>Leertaste</kbd> angeln</li>
        <li><kbd>↑</kbd> zum Hafen</li>
        <li><kbd>W</kbd> Werft</li>
      </ul>
      <button class="play" id="playBtn" aria-label="Spielen">
        <svg viewBox="0 0 24 24"><path d="M5 3.5v17a1 1 0 0 0 1.5.86l14-8.5a1 1 0 0 0 0-1.72l-14-8.5A1 1 0 0 0 5 3.5z" fill="#fff"/></svg>
      </button>
    </div>
  </div>

  <div class="start win" id="win" hidden>
    <div class="start-card" role="dialog" aria-label="Gewonnen">
      <div class="cup" aria-hidden="true">🏆</div>
      <h1>Du hast <span>gewonnen!</span></h1>
      <p>Käpt'n Glubsch ist gefangen. Jetzt wohnt er im Hafen und ist dein Freund.</p>
      <button class="again" id="winBtn">Weiterspielen</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const cv = $('#sea'), ctx = cv.getContext('2d');
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const TAU = Math.PI * 2;

/* ---------- Spieldaten ---------- */
const UP = {
  boat:  { name: 'Boot',  desc: 'Mehr Platz für Fische', vals: [3, 5, 7, 10, 14], price: [12, 35, 80, 180], said: 'Dein Boot ist jetzt größer!' },
  line:  { name: 'Angel', desc: 'Tiefer angeln',         vals: [0, 1, 2, 3],      price: [10, 30, 80],      said: 'Jetzt kannst du tiefer angeln!' },
  motor: { name: 'Motor', desc: 'Schneller fahren',      vals: [110, 160, 230, 320, 420], price: [6, 20, 50, 120], said: 'Dein Boot fährt jetzt schneller!' },
  bait:  { name: 'Köder', desc: 'Mehr Fische im Meer',   vals: [0, 1, 2, 3],      price: [15, 45, 110],     said: 'Jetzt kommen mehr Fische!' },
};
const FT = {
  sardine: { name: 'Sardine',       ein: 'Eine Sardine',       pl: 'Sardinen',        zone: 0, value: 1,  len: 30, speed: 55, color: '#ff9f43', w: 3 },
  blue:    { name: 'Blaufisch',     ein: 'Ein Blaufisch',      pl: 'Blaufische',      zone: 0, value: 2,  len: 38, speed: 45, color: '#3fa7f0', w: 2 },
  stripe:  { name: 'Streifenfisch', ein: 'Ein Streifenfisch',  pl: 'Streifenfische',  zone: 1, value: 3,  len: 42, speed: 40, color: '#5ccf6b', w: 3 },
  puffer:  { name: 'Kugelfisch',    ein: 'Ein Kugelfisch',     pl: 'Kugelfische',     zone: 1, value: 5,  len: 36, speed: 22, color: '#ffd43b', w: 2 },
  jelly:   { name: 'Qualle',        ein: 'Eine Qualle',        pl: 'Quallen',         zone: 1, value: 6,  len: 34, speed: 18, color: '#b197fc', w: 3, night: true },
  tuna:    { name: 'Thunfisch',     ein: 'Ein Thunfisch',      pl: 'Thunfische',      zone: 2, value: 8,  len: 64, speed: 70, color: '#4c6ef5', w: 3 },
  octo:    { name: 'Tintenfisch',   ein: 'Ein Tintenfisch',    pl: 'Tintenfische',    zone: 2, value: 10, len: 40, speed: 24, color: '#f06595', w: 2 },
  lantern: { name: 'Laternenfisch', ein: 'Ein Laternenfisch',  pl: 'Laternenfische',  zone: 2, value: 9,  len: 40, speed: 50, color: '#364fc7', w: 3, night: true },
  angler:  { name: 'Anglerfisch',   ein: 'Ein Anglerfisch',    pl: 'Anglerfische',    zone: 3, value: 15, len: 54, speed: 20, color: '#6a5a8c', w: 3 },
  chest:   { name: 'Schatzkiste',   ein: 'Eine Schatzkiste',   pl: 'Schatzkisten',    zone: 3, value: 30, len: 46, speed: 0,  color: '#a0632b', w: 0 },
  gold:    { name: 'Goldfisch',     ein: 'Ein Goldfisch',      pl: 'Goldfische',      zone: -1, value: 12, len: 34, speed: 60, color: '#ffcf33', w: 0 },
};
const ORDER = ['sardine', 'blue', 'stripe', 'puffer', 'jelly', 'tuna', 'octo', 'lantern', 'angler', 'chest', 'gold'];
const BIG = new Set(['tuna', 'octo', 'angler']);
const GOLD_PRICE = 150;
const BOATS = [
  { w: 76,  hull: '#a86b3c', trim: '#7a4a24' },
  { w: 90,  hull: '#2b7bb9', trim: '#ffffff' },
  { w: 104, hull: '#e8590c', trim: '#ffffff' },
  { w: 118, hull: '#c2255c', trim: '#ffe066' },
  { w: 134, hull: '#1c7c54', trim: '#ffe066' },
];

/* ---------- Speicher ---------- */
const KEY = 'kapitaen-fischkutter-v1';
const fresh = () => ({ coins: 0, lv: { boat: 0, line: 0, motor: 0, bait: 0 }, album: {}, shiny: {}, caught: 0, sold: 0, order: null, golden: false, won: false, parrot: false });
let save = fresh();
let crate = [];
function normItem(k) {
  if (typeof k === 'string') return FT[k] ? { t: k, g: false, s: false } : null;
  if (k && FT[k.t]) return { t: k.t, g: !!k.g, s: !!k.s };
  return null;
}
const normCrate = a => Array.isArray(a) ? a.map(normItem).filter(Boolean) : [];
function load(data) {
  let d = data;
  if (!d) { try { d = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { d = null; } }
  if (d && d.save) { crate = normCrate(d.crate); d = d.save; }
  else if (d && Array.isArray(d.crate)) crate = normCrate(d.crate);
  if (d && typeof d.coins === 'number') {
    const s = fresh();
    s.coins = Math.max(0, d.coins | 0);
    for (const k in s.lv) s.lv[k] = clamp((d.lv && d.lv[k]) | 0, 0, UP[k].vals.length - 1);
    s.album = d.album || {}; s.shiny = d.shiny || {}; s.caught = d.caught | 0; s.sold = d.sold | 0;
    if (d.order && FT[d.order.t]) s.order = { t: d.order.t, need: clamp(d.order.need | 0, 1, 5), have: clamp(d.order.have | 0, 0, 5), paid: !!d.order.paid };
    s.golden = !!d.golden; s.won = !!d.won; s.parrot = !!d.parrot;
    save = s;
  }
  crate = crate.slice(0, cap());
}
const itemValue = it => FT[it.t].value * (it.g ? 2 : 1) * (it.s ? 3 : 1);
function persist() { try { localStorage.setItem(KEY, JSON.stringify({ save, crate })); } catch (e) {} }
const cap = () => UP.boat.vals[save.lv.boat];

/* ---------- Ton & Sprache ---------- */
let AC = null, soundOn = true;
function ensureAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, d, type = 'sine', vol = .2, f2 = null, delay = 0) {
  if (!AC || !soundOn) return;
  const t0 = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .015);
  g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + d + .05);
}
const sfx = {
  plop()  { tone(520, .2, 'sine', .25, 130); },
  splash(){ tone(260, .14, 'triangle', .14, 700); },
  catch() { [523, 659, 784].forEach((f, i) => tone(f, .16, 'triangle', .2, null, i * .08)); },
  coin()  { tone(988, .07, 'square', .06); tone(1319, .2, 'square', .06, null, .06); },
  buy()   { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .22, 'triangle', .2, null, i * .09)); },
  fail()  { tone(240, .4, 'sawtooth', .07, 110); },

const boat = { x: 0, tx: 0, face: 1, lean: 0, moving: false };
const hook = { st: 'idle', x: 0, y: 0, fish: null, carry: null, fail: 0 };
const sell = { active: false, timer: 0, earned: 0 };
const hint = { text: '', t: 0 };
let dispCoins = 0;

function resize() {
  const r = cv.getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = r.width; H = r.height;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = clamp(Math.min(W / 1000, H / 700) * 1.15, .72, 1.25);
  G.seaY = Math.round(Math.max(160, H * .28));
  G.bottomY = H - Math.max(22, H * .04);
  G.z0 = G.seaY + 14;
  G.zoneH = (G.bottomY - G.z0) / 4;
  G.harborW = Math.round(Math.min(150, Math.max(96, W * .13)));
  G.weeds = [];
  for (let x = rand(0, 40); x < W; x += rand(50, 110)) G.weeds.push({ x, h: rand(28, 80) * S, col: ['#2f9e44', '#37b24d', '#1f7a3a', '#5c940d'][Math.random() * 4 | 0], ph: rand(0, 6) });
  G.stars = Array.from({ length: 36 }, () => ({ x: Math.random(), y: rand(.05, .7), r: rand(1.5, 3.2), ph: rand(0, 6) }));
  G.rocks = [];
  for (let i = 0; i < Math.max(3, W / 260); i++) G.rocks.push({ x: rand(0, W), r: rand(10, 24) * S, star: Math.random() < .35 });
  if (!clouds.length) for (let i = 0; i < 5; i++) clouds.push({ x: rand(0, 1), y: rand(.2, .65), s: rand(.7, 1.3), sp: rand(6, 14) });
  boat.x = clamp(boat.x || G.harborW + 140, minBoatX(), maxBoatX()); boat.tx = clamp(boat.tx || boat.x, minBoatX(), maxBoatX());
  for (const f of fishes) f.x = clamp(f.x, -80, W + 80);
  if (G.boss) { G.boss.x = clamp(G.boss.x, G.harborW + 80, W - 80); G.boss.y = bossHomeY(); }
}
const boatW = () => BOATS[save.lv.boat].w * S;
const minBoatX = () => G.harborW + boatW() * .5 + 6;
const maxBoatX = () => Math.max(minBoatX(), W - boatW() * .5 - 14 * S);
const waveY = x => G.seaY + Math.sin(x * .02 + T * 1.5) * 3 + Math.sin(x * .045 - T * 2.1) * 2;
function pose() {
  return { x: boat.x, y: waveY(boat.x) + Math.sin(T * 2.2) * 1.5, rot: Math.sin(T * 1.6) * .03 + boat.lean, face: boat.face };
}
function toWorld(lx, ly, p = pose()) {
  const px = lx * p.face, c = Math.cos(p.rot), s = Math.sin(p.rot);
  return { x: p.x + px * c - ly * s, y: p.y + px * s + ly * c };
}
const rodTip = () => { const g = boatGeo(save.lv.boat, S); return toWorld(g.tip.x, g.tip.y); };
const crateSpot = () => { const g = boatGeo(save.lv.boat, S); return toWorld(g.crateX, g.deck - 8 * S); };
const market = () => ({ x: G.harborW * .42, y: G.seaY - 44 * S });
const reachable = f => f.zone <= save.lv.line;
const reachY = () => G.z0 + (save.lv.line + 1) * G.zoneH - 6;

function fishY(f) {
  if (f.type === 'chest') return G.bottomY - 4 * S;
  const base = G.z0 + (f.zone + f.fy) * G.zoneH;
  return base + (f.type === 'octo' ? Math.sin(T * 1.6 + f.ph) * 10 * S : Math.sin(T * 1.3 + f.ph) * 3 * S);
}
function pickType(z) {
  const night = nightAmt() > .5;
  const ks = ORDER.filter(k => FT[k].zone === z && FT[k].w > 0 && (!FT[k].night || night));
  const wt = k => FT[k].w * (night && FT[k].night ? 2 : 1);
  let r = Math.random() * ks.reduce((a, k) => a + wt(k), 0);
  for (const k of ks) { r -= wt(k); if (r <= 0) return k; }
  return ks[0];
}
function spawnFish(z, onScreen) {
  let type = pickType(z);
  if (z < 3 && save.lv.bait >= 1 && Math.random() < .03 + .04 * save.lv.bait) type = 'gold';
  const dir = Math.random() < .5 ? 1 : -1;
  const f = { type, zone: z, fy: rand(.25, .75), dir, sp: FT[type].speed * rand(.8, 1.2), ph: rand(0, TAU), targeted: false, x: 0, y: 0 };
  if (type !== 'gold') {
    if (Math.random() < .035) f.s = true;
    else { const r = Math.random(); if (r < .09) f.g = true; else if (r < .33) f.small = true; }
  }
  f.sc = f.g ? 1.5 : f.small ? .8 : 1;
  f.x = onScreen ? rand(G.harborW * .6, W - 40) : (dir > 0 ? -60 : W + 60);
  f.y = fishY(f);
  return f;
}
function makeChest() {
  const f = { type: 'chest', zone: 3, fy: 1, dir: 1, sp: 0, sc: 1, ph: rand(0, 6), targeted: false, x: rand(G.harborW + 60, W - 60), y: 0 };
  f.y = fishY(f); return f;
}
const wantFish = z => (z === 0 ? 3 : 2) + save.lv.bait;
function populate() {
  fishes = [];
  for (let z = 0; z < 4; z++) for (let i = 0; i < wantFish(z); i++) fishes.push(spawnFish(z, true));
  fishes.push(makeChest());
}

/* ---------- Hinweise ---------- */
function showHint(text, speak = true, dur = 3.2) {
  hint.text = text; hint.t = dur;
  if (speak) say(text);
}

/* ---------- Eingabe ---------- */
function onTap(x, y) {
  if (!$('#win').hidden) return;
  if (bossActive()) { bossTap(x, y); return; }
  if (hook.st === 'fight') { pullTap(); return; }
  const gl = G.gull;
  if (gl && gl.st === 'in' && Math.hypot(gl.x - x, gl.y - y) < 55 * S) { scareGull(); return; }
  const wh = G.whale;
  if (wh && !wh.tapped && Math.abs(wh.x - x) < wh.L * .55 && Math.abs(wh.y - y) < wh.L * .3) { tapWhale(); return; }
  const br = boardRect();
  if (save.order && x >= br.x && x <= br.x + br.w && y >= br.y - 4 * S && y <= br.y + br.h + 8 * S) { announceOrder(); return; }
  if (x < G.harborW + 10 && y < G.seaY + 16) { goSell(); return; }
  if (y < G.seaY - 30) { if (hook.st === 'idle') { sell.active = false; boat.tx = clamp(x, minBoatX(), maxBoatX()); } return; }
  if (hook.st !== 'idle') return;
  const B = G.boss;
  if (B && B.st === 'wait' && Math.hypot(B.x - x, B.y - y) < bossL() * .6) { startBoss(); return; }
  let best = null, bd = 74 * S;
  for (const f of fishes) {
    const d = Math.hypot(f.x - x, (f.y - (f.type === 'chest' ? 12 * S : 0)) - y);
    if (d < bd) { bd = d; best = f; }
  }
  if (!best) { sell.active = false; boat.tx = clamp(x, minBoatX(), maxBoatX()); return; }
  tryCatch(best);
}
function tryCatch(f) {
  if (crate.length >= cap()) { sfx.nope(); showHint('Die Kiste ist voll! Fahr zum Hafen.'); return; }
  sell.active = false;
  hook.st = 'aim'; hook.fish = f; f.targeted = true;
}
/* Tastatur: nächsten Fisch unter dem Boot angeln, erreichbare zuerst */
function castNearest() {
  if (hook.st !== 'idle') return;
  if (G.boss && G.boss.st === 'wait' && Math.abs(G.boss.x - boat.x) < 130 * S) { startBoss(); return; }
  let best = null, bd = Infinity;
  for (const f of fishes) {
    if (f.carried || f.x < 10 || f.x > W - 10) continue;
    const d = Math.abs(f.x - boat.x) + (reachable(f) ? 0 : 100000);
    if (d < bd) { bd = d; best = f; }
  }
  if (best) tryCatch(best);
}
const keys = { left: false, right: false };
function goSell() {
  if (bossActive() || hook.st === 'fight') return;
  if (hook.st === 'aim') { if (hook.fish) hook.fish.targeted = false; hook.fish = null; hook.st = 'idle'; }
  boat.tx = minBoatX();
  if (!crate.length) { showHint('Fang erst ein paar Fische!'); return; }
  sell.active = true; sell.timer = .2; sell.earned = 0;
}
function canvasPos(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
cv.addEventListener('pointerdown', e => { ensureAudio(); const p = canvasPos(e); onTap(p.x, p.y); });

/* ---------- Partikel ---------- */
function fly(type, a, b, dur, onLand) { parts.push({ k: 'fly', type, a, b, t: 0, dur, onLand }); }
function floatText(x, y, text, color = '#fff') { parts.push({ k: 'txt', x, y, text, color, life: 1.4, max: 1.4 }); }
function sparks(x, y, n, cols) { for (let i = 0; i < n; i++) { const a = rand(0, TAU), v = rand(60, 200); parts.push({ k: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, life: rand(.5, .9), col: cols[i % cols.length] }); } }
function hudCoinTarget() {
  const r = $('#coins').getBoundingClientRect(), c = cv.getBoundingClientRect();
  return { x: r.left - c.left + 24, y: r.top - c.top + r.height / 2 };
}
function addCoins(v, x, y) {
  save.coins += v; persist();
  floatText(x, y - 10, '+' + v, '#ffe066');
  const tgt = hudCoinTarget(), n = Math.min(v, 6);
  for (let i = 0; i < n; i++) parts.push({ k: 'coin', a: { x: x + rand(-10, 10), y }, b: tgt, t: -i * .07, dur: .7 });
  sfx.coin(); updateHud();
}

/* ---------- Update ---------- */
function update(dt) {
  T += dt;
  for (const cl of clouds) { cl.x += cl.sp * dt / Math.max(W, 1); if (cl.x > 1.2) cl.x = -.2; }

  // Boot
  const kd = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (kd && (hook.st === 'idle' || hook.st === 'aim' || (G.boss && G.boss.st === 'chase'))) {
    if (hook.st === 'aim') { if (hook.fish) hook.fish.targeted = false; hook.fish = null; hook.st = 'idle'; }
    sell.active = false; boat.tx = kd > 0 ? maxBoatX() : minBoatX();
  }
  const speed = UP.motor.vals[save.lv.motor] * Math.max(1, W / 1100);
  const dx = boat.tx - boat.x, step = speed * dt;
  boat.moving = Math.abs(dx) > .5;
  if (Math.abs(dx) <= step) boat.x = boat.tx; else boat.x += Math.sign(dx) * step;
  if (Math.abs(dx) > 3 && hook.st !== 'down' && hook.st !== 'up') boat.face = Math.sign(dx);
  boat.lean += ((boat.moving ? -boat.face * .045 : 0) - boat.lean) * Math.min(1, dt * 4);
  if (boat.moving && Math.random() < dt * (14 + save.lv.motor * 8)) {
    const p = toWorld(-boatW() * .5, 2 * S);
    parts.push({ k: 'foam', x: p.x, y: p.y + rand(-2, 4), r: rand(2, 5) * S * (1 + save.lv.motor * .15), life: .8, max: .8 });
  }
  if (save.lv.boat >= 4 && Math.random() < dt * 3) {
    const g = boatGeo(4, S), p = toWorld(-w42(g) + g.w * .32 * .62 + 4 * S, g.deck - (28 + 12) * S - 16 * S);
    parts.push({ k: 'smoke', x: p.x, y: p.y, r: 5 * S, life: 2, max: 2 });
  }

  // Fische
  for (const f of fishes) {
    if (f.carried || f.hooked) continue;
    const sp = f.sp * (f.targeted ? .25 : 1) * Math.max(1, W / 1100);
    f.x += f.dir * sp * dt;
    if (f.targeted && ((f.x < 30 && f.dir < 0) || (f.x > W - 30 && f.dir > 0))) f.dir *= -1;
    f.y = fishY(f);
  }
  fishes = fishes.filter(f => f.carried || f.hooked || f.targeted || f.type === 'chest' || (f.dir > 0 ? f.x < W + 90 : f.x > -90));
  for (let z = 0; z < 4; z++) {
    const count = fishes.filter(f => f.zone === z && f.type !== 'chest' && !f.carried).length;
    if (count < wantFish(z)) { G.spawnT[z] -= dt; if (G.spawnT[z] <= 0) { fishes.push(spawnFish(z, false)); G.spawnT[z] = rand(.4, 1.8); } }
  }
  if (!fishes.some(f => f.type === 'chest')) { G.chestT -= dt; if (G.chestT <= 0) { fishes.push(makeChest()); G.chestT = 14; } }

  // Haken
  const tip = rodTip(), lineSp = (320 + 60 * save.lv.line) * Math.max(1, H / 800);
  switch (hook.st) {
    case 'idle': hook.x = tip.x; hook.y = tip.y; break;
    case 'aim': {
      const f = hook.fish;
      boat.tx = clamp(f.x, minBoatX(), maxBoatX());
      hook.x = tip.x; hook.y = tip.y;
      if (Math.abs(boat.x - f.x) < 60 * S || (boat.x === boat.tx && !boat.moving)) { hook.st = 'down'; hook.y = G.seaY; sfx.plop(); splash(tip.x, G.seaY); }
      break;
    }
    case 'down': {
      const f = hook.fish, ok = reachable(f);
      const tx = f.x, ty = ok ? f.y - (f.type === 'chest' ? 10 * S : 0) : Math.min(f.y, reachY());
      const ddx = tx - hook.x, ddy = ty - hook.y, d = Math.hypot(ddx, ddy);
      if (d < 10 * S || d < lineSp * dt) {
        if (ok) {
          if (BIG.has(f.type) || f.g) {
            f.hooked = true; f.targeted = false; hook.st = 'fight';
            hook.fp = 0; hook.ft = 6.5; hook.need = (BIG.has(f.type) ? 5 : 4) + (f.g ? 2 : 0);
            sfx.tug(); say(f.g ? 'Ein Riese! Tippe ganz schnell!' : 'Der zieht! Tippe ganz schnell!');
          } else {
            hook.carry = f; f.carried = true; f.targeted = false; hook.fish = null; hook.st = 'up';
            sfx.catch(); sparks(hook.x, hook.y, 10, ['#fff', '#a5d8ff', '#ffe066']);
          }
        } else {
          hook.st = 'fail'; hook.fail = .7; sfx.fail();
          if (save.lv.line < UP.line.vals.length - 1) showHint('Zu tief! In der Werft gibt es eine längere Angel.');
        }
      } else { hook.x += ddx / d * lineSp * dt; hook.y += ddy / d * lineSp * dt; }
      break;
    }
    case 'fail': {
      hook.fail -= dt; hook.x += Math.sin(T * 50) * 1.5;
      if (hook.fail <= 0) { if (hook.fish) hook.fish.targeted = false; hook.fish = null; hook.st = 'up'; }
      break;
    }
    case 'fight': {
      const f = hook.fish;
      hook.ft -= dt; if (hook.fp < 1) hook.fp = Math.max(0, hook.fp - dt * .08);
      f.x = clamp(f.x + Math.sin(T * 5 + f.ph) * 45 * S * dt, 20, W - 20);
      f.y = fishY(f) + Math.sin(T * 22) * 2.5 * S;
      hook.x = f.x; hook.y = f.y;
      boat.lean += Math.sin(T * 30) * .002;
      if (hook.fp >= 1) {
        f.hooked = false; hook.carry = f; f.carried = true; hook.fish = null; hook.st = 'up';
        sfx.catch(); sparks(hook.x, hook.y, 16, ['#fff', '#a5d8ff', '#ffe066']);
        floatText(hook.x, hook.y - 34 * S, 'Geschafft!', '#8ce99a');
      } else if (hook.ft <= 0) {
        f.hooked = false; f.dir = f.x > boat.x ? 1 : -1; f.sp *= 1.8; hook.fish = null; hook.st = 'up';
        sfx.fail(); showHint('Entwischt! Probier es nochmal.');
      }
      break;
    }
    case 'boss': break;
    case 'up': {
      const ddx = tip.x - hook.x, ddy = tip.y - hook.y, d = Math.hypot(ddx, ddy), sp = lineSp * 1.15;
      if (d < sp * dt || d < 6) {
        hook.x = tip.x; hook.y = tip.y; hook.st = 'idle';
        if (hook.carry) landCatch(hook.carry);
        hook.carry = null;
      } else {
        const prevY = hook.y;
        hook.x += ddx / d * sp * dt; hook.y += ddy / d * sp * dt;
        if (hook.carry && prevY > G.seaY && hook.y <= G.seaY) { sfx.splash(); splash(hook.x, G.seaY); }
      }
      if (hook.carry) { hook.carry.x = hook.x; hook.carry.y = hook.y; }
      break;
    }
  }

  // Verkaufen
  if (sell.active && hook.st === 'idle') {
    boat.tx = minBoatX();
    if (Math.abs(boat.x - boat.tx) < 2) {
      sell.timer -= dt;
      if (sell.timer <= 0) {
        if (crate.length) {
          const it = crate.shift(), v = itemValue(it); renderCrate(); persist();
          sell.earned += v; save.sold++;
          const o = save.order;
          if (o && !o.paid && it.t === o.t && o.have < o.need) {
            o.have++; const br = boardRect();
            floatText(br.x + br.w / 2, br.y - 6 * S, o.have + '/' + o.need, '#8ce99a');
          }
          const m = market();
          fly(it.t, crateSpot(), { x: m.x, y: m.y + 10 * S }, .45, p => addCoins(v, p.x, p.y - 20 * S));
          sell.timer = .38;
        } else {
          sell.active = false;
          const e = sell.earned;
          setTimeout(() => say(e === 1 ? 'Du hast eine Münze verdient!' : `Du hast ${e} Münzen verdient!`), 600);
          const o = save.order;
          if (o && !o.paid && o.have >= o.need) { o.paid = true; persist(); setTimeout(payOrder, 2600); }
        }
      }
    }
  }

  updateWorld(dt);

  // Partikel
  for (const p of parts) {
    if (p.k === 'fly' || p.k === 'coin') {
      p.t += dt;
      if (p.t >= p.dur && !p.done) { p.done = true; if (p.onLand) p.onLand(p.b); if (p.k === 'coin') bumpCoins(); }
    } else if (p.k === 'spark') { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt; }
    else if (p.k === 'txt') { p.y -= 40 * dt; p.life -= dt; }
    else if (p.k === 'bub') { p.y -= p.vy * dt; p.x += Math.sin(T * 3 + p.y * .05) * .3; p.life -= dt; if (p.y < G.seaY + 2) p.life = 0; }
    else if (p.k === 'foam') { p.life -= dt; p.r += dt * 6; }
    else if (p.k === 'smoke') { p.y -= 18 * dt; p.x -= 10 * dt * boat.face; p.r += dt * 6; p.life -= dt; }
    else if (p.k === 'drop') { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.life -= dt; }
  }
  parts = parts.filter(p => (p.k === 'fly' || p.k === 'coin') ? !p.done : p.life > 0);
  if (Math.random() < dt * 3) parts.push({ k: 'bub', x: rand(0, W), y: G.bottomY - 10, vy: rand(20, 50), r: rand(1.5, 4) * S, life: 12 });

  if (hint.t > 0) hint.t -= dt;

  // Münzzähler
  if (dispCoins < save.coins) dispCoins = Math.min(save.coins, dispCoins + Math.max(1, (save.coins - dispCoins) * dt * 6));
  else dispCoins = save.coins;
  const shown = Math.floor(dispCoins);
  if (coinNum.textContent !== String(shown)) coinNum.textContent = shown;
}
function w42(g) { return g.w * .42; }
function splash(x, y) {
  for (let i = 0; i < 8; i++) parts.push({ k: 'drop', x, y, vx: rand(-70, 70), vy: rand(-180, -80), life: .6, r: rand(1.5, 3) * S });
}
function landCatch(f) {
  fishes = fishes.filter(o => o !== f);
  const type = f.type, isNew = !save.album[type], newShiny = !!f.s && !save.shiny[type];
  save.album[type] = true; if (f.s) save.shiny[type] = true; save.caught++;
  const item = { t: type, g: !!f.g, s: !!f.s };
  fly(type, rodTip(), crateSpot(), .4, () => {
    crate.push(item); renderCrate(); persist();
    sparks(crateSpot().x, crateSpot().y, 6, ['#ffe066', '#fff']);
  });
  const ft = FT[type], tp = rodTip();
  floatText(tp.x, tp.y - 14 * S, f.s ? 'Glitzer-' + ft.name : f.g ? 'Riesen-' + ft.name : ft.name, f.s ? '#ffe066' : f.g ? '#ffc078' : '#fff');
  if (f.s) sparks(tp.x, tp.y, 18, ['#fff', '#ffe066', '#ff8fab', '#74c0fc']);
  const ph = phrase(type, f.g, f.s);
  if ((isNew || newShiny) && save.caught > 1) say(`Neu! ${ph}!`); else say(ph + '!');
  if (crate.length + 1 >= cap()) setTimeout(() => showHint('Die Kiste ist voll! Fahr zum Hafen.', true), 900);
  if (!save.parrot && ORDER.every(k => save.album[k])) {
    save.parrot = true; persist();
    setTimeout(() => {
      say('Du hast alle Fische gefunden! Ein Papagei zieht auf dein Boot!');
      sparks(boat.x, G.seaY - 40 * S, 30, ['#ff6b6b', '#ffd43b', '#4dabf7', '#69db7c']); sfx.fanfare();
    }, 1600);
  }
}

/* ---------- Abenteuer: Tag & Nacht, Möwe, Wal, Aufträge, Käpt'n Glubsch ---------- */
let clock = 0;
const smooth = k => k * k * (3 - 2 * k);
function nightAmt() {
  const cyc = clock % 130;
  if (cyc < 80) return 0;
  if (cyc < 88) return smooth((cyc - 80) / 8);
  if (cyc < 122) return 1;
  return smooth((130 - cyc) / 8);
}
function mix(a, b, k) {
  const p = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const x = p(a), y = p(b);
  return `rgb(${x.map((v, i) => Math.round(v + (y[i] - v) * k)).join(',')})`;
}
const paused = () => !$('#shop').hidden || !$('#start').hidden;
const bossActive = () => !!G.boss && G.boss.st !== 'wait';
const bossL = () => 150 * S;
const bossHomeY = () => G.bottomY - G.zoneH * .5;
const hudBottom = () => $('.hud').getBoundingClientRect().bottom - cv.getBoundingClientRect().top;
function phrase(type, g, s) {
  const ft = FT[type], fem = ft.ein.startsWith('Eine');
  if (s) return (fem ? 'Eine glitzernde ' : 'Ein glitzernder ') + ft.name;
  if (g) return (fem ? 'Eine riesige ' : 'Ein riesiger ') + ft.name;

function bossTap(x, y) {

  if (B.st === 'pull1' || B.st === 'pull2') {
    B.prog = Math.min(1, B.prog + (B.st === 'pull1' ? .08 : .1)); sfx.pull(B.prog);
    sparks(hook.x, hook.y, 3, ['#fff', '#ffe066']); B.shake = .15;

    if (best >= 0) popBlob(best);

}
function popBlob(i) {
  const B = G.boss, b = B.blobs[i]; B.blobs.splice(i, 1); sfx.plopp();
  for (let k = 0; k < 8; k++) parts.push({ k: 'bub', x: B.x + b.ox + rand(-12, 12) * S, y: B.y + b.oy, vy: rand(40, 120), r: rand(2, 5) * S, life: 3 });
}
function updateBoss(dt) {
  const B = G.boss, L = bossL(), tip = rodTip(), lineSp = (320 + 60 * save.lv.line) * Math.max(1, H / 800), homeY = bossHomeY();
  B.shake = Math.max(0, B.shake - dt);
  switch (B.st) {
    case 'wait': {
      const v = Math.cos(T * .4);
      B.x = clamp(B.x + v * 12 * S * dt, G.harborW + L * .6, W - L * .6); B.dir = v > 0 ? 1 : -1;
      B.y = homeY + Math.sin(T * 1.1) * 4 * S;

      if (Math.abs(boat.x - boat.tx) < 8 * S) { B.st = 'down'; hook.y = G.seaY; sfx.plop(); splash(tip.x, G.seaY); }
      break;
    case 'down': {
      const m = bossMouth(B), ddx = m.x - hook.x, ddy = m.y - hook.y, d = Math.hypot(ddx, ddy);
      if (d < lineSp * dt || d < 8) {
        hook.x = m.x; hook.y = m.y; B.st = 'pull1'; B.prog = 0; sfx.tug();

      } else { hook.x += ddx / d * lineSp * dt; hook.y += ddy / d * lineSp * dt; }
      break;

}

    if (Math.random() < dt * 3) { sparks(rand(W * .15, W * .85), rand(G.seaY * .25, G.seaY * .7), 24, ['#ff6b6b', '#ffd43b', '#4dabf7', '#69db7c', '#fff']); tone(rand(500, 900), .15, 'triangle', .08); }

  const b = $('#resetBtn');
  if (!resetArmed) { resetArmed = true; b.classList.add('armed'); b.textContent = 'Wirklich alles löschen? Nochmal tippen'; return; }
  save = fresh(); crate = []; dispCoins = 0; populate(); newOrder(); persist();
  G.boss = G.gull = G.whale = G.tease = null; G.party = 0; G.teaseSaid = false;
  hook.st = 'idle'; hook.fish = hook.carry = null; sell.active = false;
  boat.x = boat.tx = minBoatX() + 80;
  closeShop(); renderCrate(); updateHud();
});
const SPK_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="#173451" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#173451"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const SPK_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="#173451" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#173451"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function renderSound() { const b = $('#soundBtn'); b.innerHTML = soundOn ? SPK_ON : SPK_OFF; b.setAttribute('aria-label', soundOn ? 'Ton aus' : 'Ton an'); }
$('#soundBtn').addEventListener('click', () => {
  soundOn = !soundOn; renderSound(); ensureAudio();
  if (!soundOn) { try { speechSynthesis.cancel(); } catch (e) {} }
  try { localStorage.setItem(KEY + '-sound', soundOn ? '1' : '0'); } catch (e) {}
});
function startGame() {
  ensureAudio(); $('#start').hidden = true; sfx.buy();
  say(save.caught ? 'Willkommen zurück, Kapitän Leo!' : 'Ahoi Kapitän Leo! Tippe auf einen Fisch.');
  setTimeout(() => { if (G.boss && G.boss.st === 'wait') say('Käpt\'n Glubsch wartet ganz unten auf dich!', false); else announceOrder(); }, save.caught ? 2600 : 4200);
}
$('#winBtn').addEventListener('click', () => { $('#win').hidden = true; say('Käpt\'n Glubsch wohnt jetzt im Hafen. Viel Spaß beim Weiterangeln!'); });
$('#playBtn').addEventListener('click', startGame);

/* Tastatur: ← → fahren, Leertaste/↓ angeln, ↑/H Hafen, W Werft, 1–4 kaufen, M Ton */
document.addEventListener('keydown', e => {
  const k = e.key, shopOpen = !$('#shop').hidden, onButton = e.target && e.target.tagName === 'BUTTON';
  if (!$('#win').hidden) {
    if ((k === 'Enter' || k === ' ' || k === 'Escape') && !e.repeat) { e.preventDefault(); $('#winBtn').click(); }
    return;
  }
  if (!$('#start').hidden) {
    if ((k === 'Enter' || k === ' ') && !e.repeat) { e.preventDefault(); startGame(); }
    return;
  }
  if (k === 'm' || k === 'M') { if (!e.repeat) $('#soundBtn').click(); return; }
  if (shopOpen) {
    if (k === 'Escape' || k === 'w' || k === 'W') { e.preventDefault(); closeShop(); $('#shopBtn').focus(); }
    else if (/^[1-4]$/.test(k) && !e.repeat) { const key = ['boat', 'line', 'motor', 'bait'][+k - 1]; buy(key, $('#cards').children[+k - 1]); }
    else if (k === '5' && !e.repeat) buyGolden($('#cards').lastElementChild);
    return;
  }
  ensureAudio();
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { e.preventDefault(); keys.left = true; }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') { e.preventDefault(); keys.right = true; }
  else if (k === ' ' || k === 'ArrowDown' || k === 's' || k === 'S') {
    if (onButton && k === ' ') return;
    e.preventDefault(); if (e.repeat) return;
    if (hook.st === 'fight' || bossActive()) actionKey(); else castNearest();
  }
  else if (k === 'ArrowUp' || k === 'h' || k === 'H') { e.preventDefault(); if (!e.repeat) goSell(); }
  else if (k === 'w' || k === 'W') { e.preventDefault(); openShop(); }
});
document.addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  else return;
  if (!keys.left && !keys.right && hook.st === 'idle' && !sell.active) boat.tx = boat.x;
});
window.addEventListener('blur', () => { keys.left = keys.right = false; });

/* ---------- Start ---------- */
let last = 0;
function frame(ts) {
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
  update(dt); render();
  requestAnimationFrame(frame);
}
function start(data) {
  load(data && data.save ? data : null);
  try { soundOn = localStorage.getItem(KEY + '-sound') !== '0'; } catch (e) {}
  dispCoins = save.coins;
  resize(); populate(); ensureBoss();
  if (!save.order || save.order.paid) newOrder();
  boat.x = boat.tx = clamp(G.harborW + 160 * S, minBoatX(), maxBoatX());
  renderCrate(); renderSound(); drawShopIcon(); updateHud();
  coinNum.textContent = save.coins;
  window.addEventListener('resize', resize);
  try { window.claude?.hot?.snapshot?.(() => ({ save: JSON.parse(JSON.stringify(save)), crate: crate.slice() })); } catch (e) {}
  requestAnimationFrame(frame);
}
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
})();
</script>
